name: 构建并发布到 GitHub Pages

on:
  push:
    branches: [main]
  # PR 门禁：把 check + build + check:dist 提前到合并前跑。同仓库的 pull_request
  # 事件用的是 PR 分支自己的这份 workflow（实测 PR #24 跑到了新增的 audit 步骤），
  # 所以改完门禁文件，本 PR 就能看到效果；fork 的 PR 才取主分支版本
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只有 deploy job 需要发布权限；build job 跑 npm ci，只给读权限，
# 避免依赖 install 脚本被投毒时能铸 OIDC 令牌直接改线上 Pages
permissions:
  contents: read

concurrency:
  # 按 ref 分组：main 的构建+发布仍严格串行（不会出现取件与部署交叉），
  # PR 上的构建各走各的，也不会再挡住 main 的发布
  group: pages-${{ github.ref }}
  # false：正在跑的构建不半途中断，避免同一个 PR 连续推两次时留半成品
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 卡死的构建不该占着 runner 队列（默认上限 6 小时）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro 7 要求 Node >=22.23.4。这里必须钉死到具体小版本：
          # 写 22 时 runner 会按自己的 tool-cache 索引解析（实测取到 22.23.3），
          # 差一个补丁版本就被 astro 直接拒跑，check 步骤红
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm run audit
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
        env:
          TZ: Etc/UTC
          # 仓库改名为 <用户名>.github.io 时，把 BASE_PATH 改成 '/'
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Check dist
        run: npm run check:dist
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      # 取件与配置 Pages 只在真要发布时做：PR 跑没有 deploy job 接盘，
      # 传 artifact 纯属白传，而 configure-pages 还要多查一次 Pages 设置
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_dispatch 可在任意分支触发；不加这行守卫会把那个分支的内容直接发上线
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
